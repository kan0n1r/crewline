openapi: 3.0.3
info:
  title: Crewline API
  description: |
    HTTP API for **Crewline** — a lightweight CRM for small teams.

    Authentication uses JWT issued by `POST /api/login`. Send the token either as:
    - Cookie `token`, or
    - Header `Authorization: Bearer <token>`

    Most list/read endpoints in this demo build do not enforce auth at the gateway layer;
    `GET /api/me` requires a valid token.
  version: 1.0.0
  contact:
    name: Crewline
    url: https://github.com/kan0n1r/crewline

servers:
  - url: http://localhost:3000
    description: Local development
  - url: /
    description: Same origin (when UI and API share host)

tags:
  - name: Auth
    description: Login, logout, current session
  - name: Customers
    description: Customer directory and notes
  - name: Deals
    description: Sales pipeline
  - name: Search
    description: Customer search
  - name: Files
    description: Uploads and report export
  - name: Integrations
    description: Slack, Power BI, Google Drive, URL fetch
  - name: Team
    description: Users and profile updates
  - name: System
    description: Health and diagnostics

paths:
  /api/login:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: alice123
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: JWT session cookie named `token`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/logout:
    post:
      tags: [Auth]
      summary: Sign out
      operationId: logout
      responses:
        '200':
          description: Cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out

  /api/me:
    get:
      tags: [Auth]
      summary: Current user from JWT
      operationId: getMe
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/customers:
    get:
      tags: [Customers]
      summary: List all customers
      operationId: listCustomers
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer by ID
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/customers/{id}/notes:
    post:
      tags: [Customers]
      summary: Update customer notes
      operationId: updateCustomerNotes
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes:
                  type: string
                  example: Follow up next week
      responses:
        '200':
          description: Notes saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string
                  changes:
                    type: integer
        '500':
          $ref: '#/components/responses/ServerError'

  /api/search:
    get:
      tags: [Search]
      summary: Search customers by name or notes
      description: Returns an **HTML** document (not JSON) with matches.
      operationId: searchCustomers
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search substring
          example: Acme
      responses:
        '200':
          description: HTML result page
          content:
            text/html:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'

  /api/deals:
    get:
      tags: [Deals]
      summary: List deals with customer name
      operationId: listDeals
      responses:
        '200':
          description: Pipeline rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deal'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/upload:
    post:
      tags: [Files]
      summary: Upload a document
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File stored under uploads/
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  path:
                    type: string
                  originalName:
                    type: string
        '400':
          description: No file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/export:
    get:
      tags: [Files]
      summary: Export a simple report
      operationId: exportReport
      parameters:
        - name: format
          in: query
          schema:
            type: string
            default: csv
          description: Output format label used by the export pipeline
      responses:
        '200':
          description: Report body as plain text
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users:
    get:
      tags: [Team]
      summary: List team members
      operationId: listUsers
      responses:
        '200':
          description: Users (demo returns full row including password field)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRow'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/update:
    post:
      tags: [Team]
      summary: Update user profile fields
      operationId: updateUser
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            example:
              id: 2
              role: user
              email: alice@crm.local
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    oneOf:
                      - type: integer
                      - type: string
                  changes:
                    type: integer
        '400':
          description: Nothing to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/integrations/slack:
    post:
      tags: [Integrations]
      summary: Send Slack notification (mock)
      operationId: slackNotify
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                channel:
                  type: string
                  example: '#general'
      responses:
        '200':
          description: Mock send result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  channel:
                    type: string
                  sent:
                    type: string
                  webhook:
                    type: string

  /api/integrations/powerbi:
    get:
      tags: [Integrations]
      summary: Power BI dashboard info (mock)
      operationId: powerbiDashboard
      responses:
        '200':
          description: Embed metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboard:
                    type: string
                  embedUrl:
                    type: string
                    format: uri
                  accessToken:
                    type: string
                  lastRefresh:
                    type: string
                    format: date-time

  /api/integrations/gdrive:
    get:
      tags: [Integrations]
      summary: List Google Drive files (mock)
      operationId: gdriveList
      parameters:
        - name: folder
          in: query
          schema:
            type: string
            default: root
      responses:
        '200':
          description: Folder listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder:
                    type: string
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        mimeType:
                          type: string
                  accessToken:
                    type: string

  /api/integrations/fetch:
    post:
      tags: [Integrations]
      summary: Server-side HTTP GET to a URL
      description: Used as an integration helper to pull remote content.
      operationId: integrationFetch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  example: https://httpbin.org/get
      responses:
        '200':
          description: Upstream response (body may be truncated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  headers:
                    type: object
                    additionalProperties: true
                  data:
                    description: Response body or truncated string
        '400':
          description: url required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/health:
    get:
      tags: [System]
      summary: Liveness probe
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: team-crm

  /api/debug:
    get:
      tags: [System]
      summary: Diagnostics snapshot
      description: Returns process environment and integration-related configuration for troubleshooting.
      operationId: debug
      responses:
        '200':
          description: Diagnostic payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT set by `/api/login`
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    UserPublic:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, user]

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserPublic'
        token:
          type: string
          description: JWT (also set as cookie)

    UserRow:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        password:
          type: string
        role:
          type: string
        email:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        id:
          type: integer
          description: Target user id (optional; falls back to token subject)
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        password:
          type: string
          format: password

    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        owner_id:
          type: integer

    Deal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        amount:
          type: number
        customer_id:
          type: integer
        status:
          type: string
        customer_name:
          type: string
          nullable: true

  responses:
    Unauthorized:
      description: Missing or invalid credentials / token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
